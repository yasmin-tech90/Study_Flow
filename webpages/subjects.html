<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subjects</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <h1>Reviews</h1>

    <button id="btn2" type="button">+ Add Subject</button>
    <!--    type="button" : مهم عشان نضمن ان زرار اضافه الماده وظيفته اظهار الفورم بس مش سابميت-->

    <form id="subjectform" style="display: none;">
        <!--لاخفاء الفورم من البدايه و يظهر لما ندوس على الزرار بتاع اضافه ماده -->

        <label for="subname"> Subject Name :</label>
        <input type="text" id="subname" name="subname" required><br><br>

        <label for="startdate">Start_date:</label>
        <input type="date" id="startdate" name="startdate" required><br><br>

        <label for="examdate">assumed Exam date:</label>
        <input type="date" id="examdate" name="examdate" required><br><br>

        <button type="submit">Add Subject</button>
    </form>

    <h2>Your Subjects</h2> <!-- represent the subjects-->
    <div id="subjectsList"></div>


    <button id="reviewsBtn" type="button">View Reviews</button>














    <script src="../scripts/subjects.js"></script>
</body>

</html>
